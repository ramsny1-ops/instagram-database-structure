name: Auto-assign PRs

on:
  pull_request:
    types: [opened]

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR to owner
        uses: kentaro-m/auto-assign-action@v1
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          assignees: |
            ramsny1-ops
