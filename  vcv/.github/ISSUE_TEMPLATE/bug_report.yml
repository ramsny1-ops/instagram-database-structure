name: Bug report
description: Create a report to help us improve the schema or docs
title: '[BUG] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: e.g. The FTS index fails on insert with error ...
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where you ran the SQL or opened the database
      options:
        - sqlite3
        - sqlitebrowser
        - docker
        - other
  - type: input
    id: sql
    attributes:
      label: Relevant SQL / Commands
      description: Minimal SQL or commands to reproduce the issue.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step reproduction
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: additional
    attributes:
      label: Additional context
